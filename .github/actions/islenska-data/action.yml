name: islenska-data wheel
description: >
  Provide the islenska-data wheel (the built BÍN data: compressed.bin and
  the three DAWGs) in dist-data/. It is built once per set of inputs and
  cached; every later job and workflow run restores it from the cache.
  Optionally unpack the data files into src/islenska/resources, for jobs
  that use the data from the source checkout. Needs a checkout and a
  Python set up by the caller (actions/setup-python).

# The cache key is a hash of everything the data depend on: the BÍN source
# (KRISTINsnid.csv.zip, itself cached under a fixed key), the addition and
# word-list files, the packing tools and the libbin code the compactor
# runs, and the islenska-data package files (its version is in the wheel's
# name). Jobs and workflows share it through this one action; a tag or PR
# run can restore what a run on main saved.

inputs:
  extract:
    description: "'true' to unpack the data files into src/islenska/resources"
    required: false
    default: 'false'

outputs:
  cache-hit:
    description: "'true' if the wheel came from the cache"
    value: ${{ steps.restore.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Restore cached KRISTINsnid.csv.zip
      id: kristin
      uses: actions/cache/restore@v4
      with:
        path: src/islenska/resources/KRISTINsnid.csv.zip
        key: kristin-csv-zip-v1

    - name: Download KRISTINsnid.csv.zip
      if: steps.kristin.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p src/islenska/resources
        curl -sfL -o src/islenska/resources/KRISTINsnid.csv.zip 'https://bin.arnastofnun.is/django/api/nidurhal/?file=KRISTINsnid.csv.zip'

    - name: Save KRISTINsnid.csv.zip
      if: steps.kristin.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      continue-on-error: true  # another job may have saved it meanwhile
      with:
        path: src/islenska/resources/KRISTINsnid.csv.zip
        key: kristin-csv-zip-v1

    - name: Compute the cache key
      id: key
      shell: bash
      run: |
        echo "key=islenska-data-wheel-v1-${{ hashFiles('src/islenska/resources/KRISTINsnid.csv.zip', 'src/islenska/resources/*.csv', 'src/islenska/resources/*.txt', 'src/islenska/basics.py', 'src/islenska/dawgdictionary.py', 'src/islenska/config/*.conf', 'tools/binpack.py', 'tools/compact.py', 'tools/dawgbuilder.py', 'tools/data_package.py', 'libbin/src/*', 'libbin/include/libbin/bin.h', 'islenska-data/pyproject.toml', 'islenska-data/README.md', 'islenska-data/src/islenska_data/*') }}" >> "$GITHUB_OUTPUT"

    - name: Restore the cached islenska-data wheel
      id: restore
      uses: actions/cache/restore@v4
      with:
        path: dist-data
        key: ${{ steps.key.outputs.key }}

    # On a miss: build the data and the wheel. binpack's compound selection
    # (tools/compact.py) runs the compounder, so islenska is installed first
    # and the DAWGs are built before compressed.bin.
    - name: Build the BÍN data and the islenska-data wheel
      if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      run: |
        python -m pip install uv
        uv pip install --system --upgrade wheel setuptools cffi
        # [tool.uv.sources] makes this install the local islenska-data too
        uv pip install --system -e .
        unzip -q -o -d src/islenska/resources/ src/islenska/resources/KRISTINsnid.csv.zip
        python tools/dawgbuilder.py
        python tools/binpack.py
        python tools/data_package.py
        uv build --wheel islenska-data -o dist-data
        # Leave the checkout as a cache hit would: the data only in the wheel
        python tools/data_package.py --clean
        rm -f src/islenska/resources/compressed.bin src/islenska/resources/*.dawg.bin src/islenska/resources/KRISTINsnid.csv
        ls -l dist-data

    - name: Save the islenska-data wheel
      if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      continue-on-error: true  # another job may have saved it meanwhile
      with:
        path: dist-data
        key: ${{ steps.key.outputs.key }}

    - name: Unpack the data files into src/islenska/resources
      if: inputs.extract == 'true'
      shell: bash
      run: |
        unzip -j -o -q dist-data/islenska_data-*.whl 'islenska_data/*.bin' -d src/islenska/resources
        ls -l src/islenska/resources/*.bin
