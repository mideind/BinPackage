# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Provides the islenska-data wheel (the built BÍN data) for the jobs
  # below: restored from the cache, or built and cached here, once, when
  # its inputs have changed (see .github/actions/islenska-data). The jobs
  # restore it the same way, and build it themselves only if the restore
  # misses (GitHub's cache is eventually consistent).
  prepare-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Provide the islenska-data wheel
        uses: ./.github/actions/islenska-data

  build:
    needs: prepare-cache
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        # Test across Python versions to verify abi3 wheel compatibility
        # CPython: minimum (3.10), intermediate versions, latest stable
        # PyPy: the versions we build wheels for (see wheels.yml)
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', 'pypy-3.11', 'pypy-3.12']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install BinPackage
      run: |
        python -m pip install uv
        uv pip install --system --upgrade wheel setuptools pytest types-setuptools packaging
        uv pip install --system -e .

    - name: Lint with ruff
      run: |
        if [ "${{ matrix.python-version }}" == "3.10" ]; then uv pip install --system ruff; fi
        if [ "${{ matrix.python-version }}" == "3.10" ]; then ruff check src/islenska; fi

    - name: Type check with pyright
      run: |
        if [ "${{ matrix.python-version }}" == "3.10" ]; then uv pip install --system pyright; fi
        # pyrightconfig.json pins the target Python version and strict mode;
        # --pythonpath points pyright at the interpreter holding the deps
        if [ "${{ matrix.python-version }}" == "3.10" ]; then pyright --pythonpath "$(which python)"; fi

    - name: Provide the BÍN data
      uses: ./.github/actions/islenska-data
      with:
        extract: 'true'

    - name: Test with pytest
      run: |
        python -m pytest

    - name: Slack notification
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        author_name: Integration Testing (Python ${{ matrix.python-version }})
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      if: failure() # Pick up event if the job fails

  # The C++ library must build and pass its smoke test standalone,
  # against the built data.
  libbin:
    needs: prepare-cache
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Provide the BÍN data
      uses: ./.github/actions/islenska-data
      with:
        extract: 'true'

    - name: Build and test libbin
      run: |
        cmake -S libbin -B libbin/build -DCMAKE_BUILD_TYPE=Release
        cmake --build libbin/build -j
        libbin/build/bin_test src/islenska/resources

    - name: Slack notification
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        author_name: libbin
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      if: failure()

  # The split into islenska (code) and islenska-data (data files): build an
  # islenska wheel, which has no data files, install it with the
  # islenska-data wheel into a fresh environment, and run the test suite
  # there.
  # The islenska-data wheel is kept as an artifact; nothing is published.
  data-package:
    needs: prepare-cache
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Provide the islenska-data wheel
      uses: ./.github/actions/islenska-data

    - name: Install uv
      run: python -m pip install uv

    - name: Build an islenska wheel without the data files
      run: |
        uv build --wheel -o dist-code
        ls -l dist-data dist-code
        if unzip -l dist-code/*.whl | grep -q '\.bin$'; then
          echo "The islenska wheel contains data files"; exit 1
        fi

    - name: Test the two wheels together
      run: |
        uv venv /tmp/split
        uv pip install --python /tmp/split/bin/python dist-data/*.whl dist-code/*.whl pytest
        /tmp/split/bin/python -c "import islenska_data; from islenska.basics import data_dir; assert data_dir() == islenska_data.data_dir(), data_dir()"
        /tmp/split/bin/python -m pytest -p no:cacheprovider test

    - uses: actions/upload-artifact@v4
      with:
        name: islenska-data-wheel
        path: dist-data/*.whl
        retention-days: 7

    - name: Slack notification
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        author_name: islenska-data package
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      if: failure()
