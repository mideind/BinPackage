# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  prepare-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache KRISTINsnid.csv.zip
        id: cache-kristin
        uses: actions/cache@v4
        with:
          path: src/islenska/resources/KRISTINsnid.csv.zip
          key: kristin-csv-zip-v1
      - name: Download KRISTINsnid.csv.zip
        if: steps.cache-kristin.outputs.cache-hit != 'true'
        run: |
          mkdir -p src/islenska/resources
          wget -q -O src/islenska/resources/KRISTINsnid.csv.zip 'https://bin.arnastofnun.is/django/api/nidurhal/?file=KRISTINsnid.csv.zip'

      # The built data (compressed.bin, the compact variant and the three
      # DAWGs) is cached under a hash of everything it depends on: the BÍN
      # source, the addition and word-list files, the packing tools and
      # the libbin DAWG code the compactor runs. It is built here, once,
      # only when that hash has no cache entry yet; the jobs below restore
      # it, and rebuild themselves only if the restore misses.
      - name: Restore built BÍN data
        id: cache-bin-data
        uses: actions/cache@v4
        with:
          path: |
            src/islenska/resources/compressed.bin
            src/islenska/resources/compressed-compact.bin
            src/islenska/resources/ordalisti-all.dawg.bin
            src/islenska/resources/ordalisti-prefixes.dawg.bin
            src/islenska/resources/ordalisti-suffixes.dawg.bin
          key: bin-data-v1-${{ hashFiles('src/islenska/resources/KRISTINsnid.csv.zip', 'src/islenska/resources/*.csv', 'src/islenska/resources/*.txt', 'src/islenska/basics.py', 'src/islenska/dawgdictionary.py', 'src/islenska/config/*.conf', 'tools/binpack.py', 'tools/compact.py', 'tools/dawgbuilder.py', 'libbin/src/*', 'libbin/include/libbin/bin.h') }}
      - name: Set up Python
        if: steps.cache-bin-data.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build the BÍN data
        if: steps.cache-bin-data.outputs.cache-hit != 'true'
        run: |
          python -m pip install uv
          uv pip install --system --upgrade wheel setuptools cffi
          uv pip install --system -e .
          python tools/dawgbuilder.py
          unzip -q -d src/islenska/resources/ src/islenska/resources/KRISTINsnid.csv.zip
          python tools/binpack.py
          python tools/binpack.py --compact -o src/islenska/resources/compressed-compact.bin
          ls -l src/islenska/resources/*.bin

  build:
    needs: prepare-cache
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        # Test across Python versions to verify abi3 wheel compatibility
        # CPython: minimum (3.9), intermediate versions, latest stable
        # PyPy: only the version we build wheels for (see wheels.yml)
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14', 'pypy-3.11']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Restore cached KRISTINsnid.csv.zip
      id: cache-kristin
      uses: actions/cache@v4
      with:
        path: src/islenska/resources/KRISTINsnid.csv.zip
        key: kristin-csv-zip-v1

    # The prepare-cache job warms the cache, but GitHub's cache service is
    # eventually consistent: on the very first run (cold cache) the entry it
    # just saved is not always queryable when this restore runs, so the cache
    # can miss here even though prepare-cache succeeded. Download as a fallback
    # so a miss is never fatal; this job then saves the cache for later jobs.
    - name: Download KRISTINsnid.csv.zip
      if: steps.cache-kristin.outputs.cache-hit != 'true'
      run: |
        mkdir -p src/islenska/resources
        wget -q -O src/islenska/resources/KRISTINsnid.csv.zip 'https://bin.arnastofnun.is/django/api/nidurhal/?file=KRISTINsnid.csv.zip'

    - name: Install BinPackage
      run: |
        python -m pip install uv
        uv pip install --system --upgrade wheel setuptools pytest types-setuptools packaging
        uv pip install --system -e .

    - name: Lint with ruff
      run: |
        if [ "${{ matrix.python-version }}" == "3.9" ]; then uv pip install --system ruff; fi
        if [ "${{ matrix.python-version }}" == "3.9" ]; then ruff check src/islenska; fi

    - name: Type check with pyright
      run: |
        if [ "${{ matrix.python-version }}" == "3.9" ]; then uv pip install --system pyright; fi
        # pyrightconfig.json pins the target Python version and strict mode;
        # --pythonpath points pyright at the interpreter holding the deps
        if [ "${{ matrix.python-version }}" == "3.9" ]; then pyright --pythonpath "$(which python)"; fi

    - name: Restore built BÍN data
      id: cache-bin-data
      uses: actions/cache@v4
      with:
        path: |
          src/islenska/resources/compressed.bin
          src/islenska/resources/compressed-compact.bin
          src/islenska/resources/ordalisti-all.dawg.bin
          src/islenska/resources/ordalisti-prefixes.dawg.bin
          src/islenska/resources/ordalisti-suffixes.dawg.bin
        key: bin-data-v1-${{ hashFiles('src/islenska/resources/KRISTINsnid.csv.zip', 'src/islenska/resources/*.csv', 'src/islenska/resources/*.txt', 'src/islenska/basics.py', 'src/islenska/dawgdictionary.py', 'src/islenska/config/*.conf', 'tools/binpack.py', 'tools/compact.py', 'tools/dawgbuilder.py', 'libbin/src/*', 'libbin/include/libbin/bin.h') }}

    - name: Build *.dawg.bin
      if: steps.cache-bin-data.outputs.cache-hit != 'true'
      run: |
        python tools/dawgbuilder.py

    - name: Build compressed.bin
      if: steps.cache-bin-data.outputs.cache-hit != 'true'
      run: |
        unzip -q -d src/islenska/resources/ src/islenska/resources/KRISTINsnid.csv.zip
        python tools/binpack.py

    - name: Test with pytest
      run: |
        python -m pytest

    - name: Slack notification
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        author_name: Integration Testing (Python ${{ matrix.python-version }})
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      if: failure() # Pick up event if the job fails

  # The compact build (tools/binpack.py --compact) and the C++ library:
  # the test suite must pass unchanged against the compact file, a sample
  # parity check must find no difference from the full file, and libbin
  # must build and pass its smoke test standalone on both files.
  compact:
    needs: prepare-cache
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Restore cached KRISTINsnid.csv.zip
      id: cache-kristin
      uses: actions/cache@v4
      with:
        path: src/islenska/resources/KRISTINsnid.csv.zip
        key: kristin-csv-zip-v1

    - name: Download KRISTINsnid.csv.zip
      if: steps.cache-kristin.outputs.cache-hit != 'true'
      run: |
        mkdir -p src/islenska/resources
        wget -q -O src/islenska/resources/KRISTINsnid.csv.zip 'https://bin.arnastofnun.is/django/api/nidurhal/?file=KRISTINsnid.csv.zip'

    - name: Install BinPackage
      run: |
        python -m pip install uv
        uv pip install --system --upgrade wheel setuptools pytest cffi
        uv pip install --system -e .

    - name: Restore built BÍN data
      id: cache-bin-data
      uses: actions/cache@v4
      with:
        path: |
          src/islenska/resources/compressed.bin
          src/islenska/resources/compressed-compact.bin
          src/islenska/resources/ordalisti-all.dawg.bin
          src/islenska/resources/ordalisti-prefixes.dawg.bin
          src/islenska/resources/ordalisti-suffixes.dawg.bin
        key: bin-data-v1-${{ hashFiles('src/islenska/resources/KRISTINsnid.csv.zip', 'src/islenska/resources/*.csv', 'src/islenska/resources/*.txt', 'src/islenska/basics.py', 'src/islenska/dawgdictionary.py', 'src/islenska/config/*.conf', 'tools/binpack.py', 'tools/compact.py', 'tools/dawgbuilder.py', 'libbin/src/*', 'libbin/include/libbin/bin.h') }}

    - name: Build *.dawg.bin
      if: steps.cache-bin-data.outputs.cache-hit != 'true'
      run: python tools/dawgbuilder.py

    - name: Build compressed.bin, full and compact
      if: steps.cache-bin-data.outputs.cache-hit != 'true'
      run: |
        unzip -q -d src/islenska/resources/ src/islenska/resources/KRISTINsnid.csv.zip
        python tools/binpack.py
        python tools/binpack.py --compact -o src/islenska/resources/compressed-compact.bin
        ls -l src/islenska/resources/compressed*.bin

    - name: Test with pytest against the compact file
      run: python -m pytest
      env:
        ISLENSKA_BIN_FILE: src/islenska/resources/compressed-compact.bin

    - name: Parity check (sample)
      run: python tools/parity.py src/islenska/resources/compressed.bin src/islenska/resources/compressed-compact.bin --sample 200000

    - name: Build and test libbin
      run: |
        cmake -S libbin -B libbin/build -DCMAKE_BUILD_TYPE=Release
        cmake --build libbin/build -j
        libbin/build/bin_test src/islenska/resources
        mkdir compact-data
        cp src/islenska/resources/compressed-compact.bin compact-data/compressed.bin
        cp src/islenska/resources/ordalisti-*.dawg.bin compact-data/
        libbin/build/bin_test compact-data

    - name: Slack notification
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        author_name: Compact build and libbin
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      if: failure()
