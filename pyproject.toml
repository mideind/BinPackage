[build-system]
requires = ["setuptools>=61.0", "cffi>=1.17.1", "wheel>=0.38.0"]
build-backend = "setuptools.build_meta"

[project]
name = "islenska"
version = "2.0.0"
description = "The vocabulary of modern Icelandic, encapsulated in a Python package"
authors = [{ name = "Miðeind ehf.", email = "mideind@mideind.is" }]
maintainers = [{ name = "Miðeind ehf.", email = "mideind@mideind.is" }]
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "MIT License" }
keywords = ["nlp", "icelandic", "language", "vocabulary", "dictionary"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Unix",
    "Operating System :: POSIX",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Natural Language :: Icelandic",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    # PyPy wheels are published for PyPy 3.11 (PyPy 7.3 and 8.0) and
    # PyPy 3.12 (see .github/workflows/wheels.yml).
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Topic :: Text Processing :: Linguistic",
]
requires-python = ">=3.10"
# islenska-data holds the data files; its major.minor version is the data
# format of compressed.bin (5.0 for 'Greynir 05.00.00', BIN_COMPRESSOR_VERSION
# in basics.py), which this version reads, so allow only its patch releases
dependencies = ["cffi>=1.17.1", "typing_extensions", "islenska-data ~= 5.0.0"]

[project.urls]
Repository = "https://github.com/mideind/BinPackage"

[project.optional-dependencies]
# dev dependencies
dev = ["pytest", "pyright"]

# *** Configuration of tools ***

[tool.uv.sources]
# In this repository, islenska-data is the subproject in islenska-data/; it
# holds no data unless tools/data_package.py staged some, and the data built
# into src/islenska/resources take precedence anyway (basics.data_dir())
islenska-data = { path = "islenska-data", editable = true }

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
islenska = ["py.typed"]

[tool.ruff]
line-length = 88
# The rule set is pinned explicitly: CI installs the latest ruff, and ruff's
# own default set has grown (0.16 added pyupgrade, isort and more), which
# would otherwise fail the lint step without any change to the code.
# These are the classic defaults: pyflakes plus the pycodestyle error
# subsets E4, E7 and E9.
lint.select = ["E4", "E7", "E9", "F"]
# Ignore specific rules
# (we should aim to have these as few as possible)
lint.ignore = [
    "E731", # 'E731: Do not assign a lambda expression, use a def'
]

[tool.isort]
# This forces these imports to placed at the top
known_future_library = ["__future__", "typing", "typing_extensions"]
line_length = 88
